# Jellyfin
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector: { matchLabels: { app: jellyfin } }
  strategy:
    canary:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata: { labels: { app: jellyfin } }
    spec:
      nodeSelector:
        kubernetes.io/hostname: rasppi516
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin@sha256:90320cf7522a80ae4f343ace77fdcde173f1bf9dc579b9beaffe5bc76f3934e0
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: "America/Santo_Domingo" }
          ports:
            - { containerPort: 8096, name: http }
          volumeMounts:
            - { name: cfg, mountPath: /config }
            - { name: media, mountPath: /data/media }
      volumes:
        - { name: cfg,  persistentVolumeClaim: { claimName: jellyfin-config-pvc } }
        - { name: media, persistentVolumeClaim: { claimName: media-pvc } }

# jellyseerr
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: jellyseerr
  namespace: media
spec:
  replicas: 1
  selector: { matchLabels: { app: jellyseerr } }
  strategy:
    canary:
      # SQLite is stored on the shared config PVC. Never run the old and new
      # application versions concurrently during schema migrations.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata: { labels: { app: jellyseerr } }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: rasppi516
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jellyseerr
          image: ghcr.io/seerr-team/seerr@sha256:b00989ab7cf7d21a73ba4d3c02a9b9459b279a9b237d59bee66dcace8dccd1cb
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - { name: TZ, value: "America/Santo_Domingo" }
          ports:
            - { containerPort: 5055, name: http }
          startupProbe:
            httpGet: { path: /api/v1/settings/public, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/v1/settings/public, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/v1/settings/public, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: cfg, mountPath: /app/config }
      volumes:
        - { name: cfg,  persistentVolumeClaim: { claimName: jellyseerr-config-pvc } }


